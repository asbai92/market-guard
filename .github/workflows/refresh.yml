name: Refresh Market Guard data
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-guard-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter et calculer les indicateurs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update.py
      - name: Enregistrer les données sans conflit
        run: |
          cp data/latest.json /tmp/market-latest.json
          cp data/state.json /tmp/market-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market-latest.json data/latest.json
          cp /tmp/market-state.json data/state.json
          git add data/latest.json data/state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualisation des données Market Guard"
            git push
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier le site
        uses: actions/deploy-pages@v4