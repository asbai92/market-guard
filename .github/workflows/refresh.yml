name: Refresh Market Guard data
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-guard-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter et calculer les indicateurs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update.py
      - name: Enregistrer les données avec reprise sur conflit
        run: |
          cp data/latest.json /tmp/market-latest.json
          cp data/state.json /tmp/market-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/market-latest.json data/latest.json
            cp /tmp/market-state.json data/state.json
            git add data/latest.json data/state.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Actualisation des données Market Guard"
            if git push; then
              exit 0
            fi
            echo "Conflit Git, nouvelle tentative $attempt/5"
            sleep 2
          done
          echo "Impossible de pousser les données après cinq tentatives"
          exit 1
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier le site
        uses: actions/deploy-pages@v4