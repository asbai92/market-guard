name: Weekly Market Guard backtest
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/backtest.json"
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 0"
permissions:
  contents: write
concurrency:
  group: market-guard-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical technical backtest
        run: python backtest.py
      - name: Commit backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Weekly update of historical backtest"
          git push
